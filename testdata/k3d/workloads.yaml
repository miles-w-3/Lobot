apiVersion: v1
kind: Namespace
metadata:
  name: lobot-demo
  labels:
    app.kubernetes.io/part-of: lobot-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lobot-workload
  namespace: lobot-demo
  labels:
    app.kubernetes.io/part-of: lobot-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lobot-config
  namespace: lobot-demo
  labels:
    app.kubernetes.io/part-of: lobot-test
data:
  MESSAGE: "hello from the Lobot k3d fixture"
---
apiVersion: v1
kind: Secret
metadata:
  name: lobot-secret
  namespace: lobot-demo
  labels:
    app.kubernetes.io/part-of: lobot-test
type: Opaque
stringData:
  TOKEN: local-development-only
---
apiVersion: v1
kind: Service
metadata:
  name: lobot-web
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-web
    app.kubernetes.io/part-of: lobot-test
spec:
  selector:
    app.kubernetes.io/name: lobot-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobot-web
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-web
    app.kubernetes.io/part-of: lobot-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lobot-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lobot-web
        app.kubernetes.io/part-of: lobot-test
    spec:
      serviceAccountName: lobot-workload
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: lobot-config
                  key: MESSAGE
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: lobot-secret
                  key: TOKEN
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobot-broken
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-broken
    app.kubernetes.io/part-of: lobot-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lobot-broken
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lobot-broken
        app.kubernetes.io/part-of: lobot-test
    spec:
      containers:
        - name: missing-image
          image: registry.invalid/lobot/does-not-exist:v1
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lobot-stateful
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-stateful
    app.kubernetes.io/part-of: lobot-test
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: lobot-stateful
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lobot-stateful
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-stateful
    app.kubernetes.io/part-of: lobot-test
spec:
  serviceName: lobot-stateful
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lobot-stateful
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lobot-stateful
        app.kubernetes.io/part-of: lobot-test
    spec:
      initContainers:
        - name: initialize-data
          image: busybox:1.36
          command: ["sh", "-c", "echo stateful fixture > /data/index.html"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 48Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: lobot-test
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 64Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lobot-agent
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-agent
    app.kubernetes.io/part-of: lobot-test
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lobot-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lobot-agent
        app.kubernetes.io/part-of: lobot-test
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lobot-bootstrap
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-bootstrap
    app.kubernetes.io/part-of: lobot-test
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lobot-bootstrap
        app.kubernetes.io/part-of: lobot-test
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: busybox:1.36
          command: ["sh", "-c", "echo Lobot fixture initialized"]
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 20m
              memory: 12Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lobot-scheduled
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-scheduled
    app.kubernetes.io/part-of: lobot-test
spec:
  schedule: "*/5 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lobot-scheduled
            app.kubernetes.io/part-of: lobot-test
        spec:
          restartPolicy: Never
          containers:
            - name: scheduled
              image: busybox:1.36
              command: ["sh", "-c", "date"]
              resources:
                requests:
                  cpu: 5m
                  memory: 4Mi
                limits:
                  cpu: 20m
                  memory: 12Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lobot-web
  namespace: lobot-demo
  labels:
    app.kubernetes.io/name: lobot-web
    app.kubernetes.io/part-of: lobot-test
spec:
  rules:
    - host: lobot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lobot-web
                port:
                  name: http
