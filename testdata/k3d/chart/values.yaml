replicaCount: 1

# Extra lightweight release resources make the Helm graph wide enough to test
# horizontal canvas panning without creating additional workloads.
extraConfigMaps: 24

image:
  repository: nginx
  tag: 1.27-alpine

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 48Mi
